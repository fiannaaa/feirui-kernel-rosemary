name: Build FeiRui Kernel

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile FeiRui Kernel for Rosemary (MT6785)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev zip curl python3 ccache cpio unzip
          sudo apt-get clean

      - name: Clone Rosemary Android 16 Kernel Source (4.19.325)
        run: |
          echo "Cloning official Rosemary 4.19.325 tree with SuSFS..."
          git clone --depth=1 -b A16-lineage-KS https://github.com/omrxm18/android_kernel_xiaomi_mt6785.git kernel_workspace
          cd kernel_workspace
          echo "Cloning KernelSU-Next legacy tree..."
          git clone --depth=1 -b legacy https://github.com/omrxm18/KernelSU-Next.git KernelSU-Next
          echo "Source trees ready."

      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchains/clang-r563880c
          key: clang-r563880c-v1

      - name: Download AOSP Clang (Android 16 QPR2 r563880c)
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          TOOLCHAIN_DIR="${{ github.workspace }}/toolchains/clang-r563880c"
          mkdir -p "$TOOLCHAIN_DIR"
          echo "Downloading Android 16 Clang toolchain..."
          curl -fL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/heads/android16-qpr2-release/clang-r563880c.tar.gz" -o /tmp/clang.tar.gz
          tar -xzf /tmp/clang.tar.gz -C "$TOOLCHAIN_DIR"
          rm -f /tmp/clang.tar.gz

      - name: Verify Toolchain
        run: |
          "${{ github.workspace }}/toolchains/clang-r563880c/bin/clang" --version

      - name: Apply FeiRui Anti-Crash & Performance Patches
        run: |
          cd kernel_workspace
          echo "Applying Deep Sleep Anti-Crash patch (Fix aggressive_idle_pull)..."
          # Matikan MTK_IDLE_BALANCE_ENHANCEMENT agar bug panic aggressive_idle_pull hilang total
          sed -i 's/CONFIG_MTK_IDLE_BALANCE_ENHANCEMENT=y/# CONFIG_MTK_IDLE_BALANCE_ENHANCEMENT is not set/' arch/arm64/configs/rosemary_defconfig
          sed -i 's/pulled_task = aggressive_idle_pull(this_cpu);/\/* FeiRui anti-crash *\/ pulled_task = 0;/g' kernel/sched/fair.c 2>/dev/null || true

          echo "Applying USB Tethering fix..."
          for f in $(grep -rnwl "rndis_wceis" drivers/usb/gadget/ 2>/dev/null || true); do
            sed -i 's/rndis_wceis/rndis_generic/g' "$f" 2>/dev/null || true
          done

          echo "Configuring FeiRui branding & enhancements..."
          DEFCONFIG="arch/arm64/configs/rosemary_defconfig"
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-FeiRui-v1.0"/' $DEFCONFIG
          
          # Networking & Performance
          echo "CONFIG_TCP_CONG_BBR=y" >> $DEFCONFIG
          echo "CONFIG_TCP_CONG_WESTWOOD=y" >> $DEFCONFIG
          echo "CONFIG_DEFAULT_TCP_CONG=\"bbr\"" >> $DEFCONFIG
          echo "CONFIG_NETFILTER_XT_TARGET_HL=y" >> $DEFCONFIG
          echo "CONFIG_ZRAM=y" >> $DEFCONFIG
          echo "CONFIG_ZRAM_DEF_COMP_ZSTD=y" >> $DEFCONFIG
          echo "CONFIG_ZRAM_DEF_COMP=\"zstd\"" >> $DEFCONFIG
          echo "CONFIG_WIREGUARD=y" >> $DEFCONFIG

      - name: Build FeiRui Kernel
        run: |
          cd kernel_workspace
          chmod +x build.sh
          ./build.sh --toolchain "${{ github.workspace }}/toolchains/clang-r563880c/bin"

      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FeiRui-Kernel-rosemary-v1.0
          path: kernel_workspace/builds/*.zip
          retention-days: 7

      - name: Upload Error Logs (If Failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            kernel_workspace/build.log
            kernel_workspace/errors.log
          if-no-files-found: ignorea
